[project]
# Distribution name on PyPI is `mlx-memo`. Why: (1) `memo` (v0.2.4) is taken
# by an unrelated package; (2) `memo-mcp` collides with milasd/memo-mcp
# (a ChromaDB-based local journal MCP). The Python module / CLI binary
# (`memo`) / MCP server binary (`memo-mcp`) / repo all keep their names —
# only the PyPI distribution moved. Back-compat: existing users on
# `memo-mcp ≤ 0.4.3` keep working; new installs use `pip install mlx-memo`.
name = "mlx-memo"
version = "0.8.0"
description = "Local MCP memory backed by Obsidian vault — MLX-native LLM + embedder, sqlite-vec store. No Ollama, no API keys."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Fernando Ferrari" }]
keywords = ["mcp", "memory", "obsidian", "mlx", "rag", "agents", "claude", "local-first", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7",
    "pydantic>=2.6",
    "sqlite-vec>=0.1.6",
    "fastmcp>=0.5",
    "python-frontmatter>=1.1",
    # First-run interactive picker (pure Python; cross-platform).
    "questionary>=2.0",
    "tomli-w>=1.0",
    # File-watcher (FSEvents on macOS). Used by `memo watch`.
    "watchdog>=4.0",
    # MLX runtime — Apple Silicon only.
    "mlx>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/jagoff/memo"
Repository = "https://github.com/jagoff/memo"
Issues = "https://github.com/jagoff/memo/issues"
Changelog = "https://github.com/jagoff/memo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Apple Vision OCR for screenshots/images embedded in Obsidian notes.
# macOS-only. Install with: pip install -e ".[ocr]"
ocr = [
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
memo = "memo.cli:main"
memo-mcp = "memo.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memo"]

[tool.hatch.build.targets.wheel.force-include]
".agents" = "memo/agent_assets/.agents"
".claude-plugin" = "memo/agent_assets/.claude-plugin"
"commands" = "memo/agent_assets/commands"
"hooks" = "memo/agent_assets/hooks"
"plugins" = "memo/agent_assets/plugins"
"server.json" = "memo/agent_assets/server.json"
"skills" = "memo/agent_assets/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_mlx: smoke test que carga modelos MLX reales (Apple Silicon only). Auto-skipea sin mlx_lm.",
    "slow: tests >1s; default `-m 'not slow'`.",
]

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["frontmatter", "sqlite_vec"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
