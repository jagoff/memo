[project]
name = "mem-lmx"
version = "0.1.0"
description = "Local MCP memory backed by Obsidian vault — MLX-native LLM + embedder, sqlite-vec store. No Ollama, no API keys."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Fer" }]
keywords = ["mcp", "memory", "obsidian", "mlx", "rag", "agents", "claude", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
]

dependencies = [
    "click>=8.1.7",
    "rich>=13.7",
    "pydantic>=2.6",
    "sqlite-vec>=0.1.6",
    "fastmcp>=0.5",
    "python-frontmatter>=1.1",
    "watchdog>=4.0",
    # MLX runtime — Apple Silicon only.
    "mlx>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mem-lmx = "mem_lmx.cli:main"
mem-lmx-mcp = "mem_lmx.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mem_lmx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_mlx: smoke test que carga modelos MLX reales (Apple Silicon only). Auto-skipea sin mlx_lm.",
    "slow: tests >1s; default `-m 'not slow'`.",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
