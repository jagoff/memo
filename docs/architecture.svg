  <rect x="40" y="286" width="195" height="172" class="box box-hook" rx="8" filter="url(#shadow)"/>
  <text x="137" y="308" class="label">Claude Code hooks</text>
  <text x="137" y="323" class="meta">(plugin-installed)</text>
  <rect x="55" y="334" width="165" height="40" class="box" rx="6"/>
  <text x="137" y="352" class="label" font-size="12">SessionStart</text>
  <text x="137" y="366" class="meta">prewarm · El Briefing</text>
  <rect x="55" y="382" width="165" height="40" class="box" rx="6"/>
  <text x="137" y="400" class="label" font-size="12">UserPromptSubmit</text>
  <text x="137" y="415" class="meta">recall-hook · 5 s budget</text>
  <rect x="55" y="430" width="165" height="22" class="box" rx="6"/>
  <text x="137" y="445" class="label" font-size="11">Stop · capture-stop</text>

  <line class="arrow-b" x1="235" y1="422" x2="263" y2="370"/>

  <!-- ============== CORE ============== -->
  <text x="263" y="283" class="section">core · Memory facade (10 mixin ops)</text>
  <rect x="263" y="288" width="657" height="86" class="box box-core" rx="8" filter="url(#shadow)"/>
  <text x="591" y="313" class="label">Memory API</text>
  <text x="591" y="331" class="meta">save · search(vec|bm25|hybrid) · get · update · delete · reindex · ask · consolidate · synthesize · contradict</text>
  <rect x="279" y="348" width="150" height="22" class="box" rx="5"/>
  <text x="354" y="364" class="label" font-size="11">hybrid pipeline + RRF</text>
  <rect x="443" y="348" width="145" height="22" class="box" rx="5"/>
  <text x="515" y="364" class="label" font-size="11">cross-encoder rerank</text>
  <rect x="602" y="348" width="145" height="22" class="box" rx="5"/>
  <text x="675" y="364" class="label" font-size="11">prefix-ID · as-of replay</text>
  <rect x="761" y="348" width="149" height="22" class="box" rx="5"/>
  <text x="835" y="364" class="label" font-size="11">graph + entities</text>

  <!-- arrows down to MLX and storage -->
  <line class="arrow" x1="440" y1="374" x2="440" y2="412"/>
  <line class="arrow" x1="720" y1="374" x2="720" y2="412"/>

  <!-- ============== MLX ROW ============== -->
  <text x="263" y="409" class="section">mlx · in-process · apple silicon · deferred import</text>
  <rect x="263" y="415" width="657" height="86" class="group-rect" rx="10"/>

  <rect x="278" y="424" width="193" height="68" class="box box-mlx" rx="8" filter="url(#shadow)"/>
  <text x="375" y="443" class="label">embedder</text>
  <text x="375" y="459" class="meta">Qwen3-Embedding-0.6B/4B/8B</text>
