  <rect x="40" y="481" width="195" height="152" class="group-rect" rx="10"/>

  <rect x="55" y="489" width="165" height="44" class="box box-store" rx="8" filter="url(#shadow)"/>
  <text x="137" y="508" class="label" font-size="12">.md files</text>
  <text x="137" y="523" class="meta">source of truth · Obsidian vault</text>

  <rect x="55" y="540" width="165" height="36" class="box" rx="8" filter="url(#shadow)"/>
  <text x="137" y="558" class="label" font-size="12">sqlite-vec (memvec.db)</text>
  <text x="137" y="572" class="meta">vec + BM25 · rebuildable</text>

  <rect x="55" y="583" width="165" height="42" class="box" rx="8" filter="url(#shadow)"/>
  <text x="137" y="601" class="label" font-size="12">history.db</text>
  <text x="137" y="615" class="meta">append-only audit log</text>
  <text x="137" y="628" class="meta">reverse-replay → time-machine</text>

  <!-- core→storage arrows -->
  <line class="arrow" x1="283" y1="374" x2="224" y2="509"/>
  <line class="arrow" x1="283" y1="374" x2="224" y2="557"/>
  <line class="arrow" x1="283" y1="374" x2="224" y2="601"/>

  <!-- ============== SUBSYSTEMS ROW ============== -->
  <text x="263" y="527" class="section">subsystems</text>
  <rect x="263" y="533" width="657" height="100" class="group-rect" rx="10"/>

  <rect x="278" y="542" width="118" height="82" class="box box-amber" rx="8" filter="url(#shadow)"/>
  <text x="337" y="562" class="label" font-size="12">time-machine</text>
  <text x="337" y="578" class="meta">memo as-of ask</text>
  <text x="337" y="592" class="meta">memo diff</text>
