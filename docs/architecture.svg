  <text x="467" y="578" class="meta">memo contradict scan</text>
  <text x="467" y="592" class="meta">LLM pair classify</text>
  <text x="467" y="606" class="meta">contradictions.db</text>

  <rect x="538" y="542" width="118" height="82" class="box box-purple" rx="8" filter="url(#shadow)"/>
  <text x="597" y="562" class="label" font-size="12">synthesis</text>
  <text x="597" y="578" class="meta">memo synthesize</text>
  <text x="597" y="592" class="meta">memo dream</text>
  <text x="597" y="606" class="meta">synthesis_sources</text>

  <rect x="668" y="542" width="118" height="82" class="box box-teal" rx="8" filter="url(#shadow)"/>
  <text x="727" y="562" class="label" font-size="12">knowledge graph</text>
  <text x="727" y="578" class="meta">memo graph</text>
  <text x="727" y="592" class="meta">memo entities</text>
  <text x="727" y="606" class="meta">graph.db</text>

  <rect x="798" y="542" width="112" height="82" class="box box-blue" rx="8" filter="url(#shadow)"/>
  <text x="854" y="562" class="label" font-size="12">cross-Mac sync</text>
  <text x="854" y="578" class="meta">git remote</text>
  <text x="854" y="592" class="meta">flock · rebase</text>
  <text x="854" y="606" class="meta">memo sync</text>

  <!-- ============== FOOTER BANNER ============== -->
  <rect x="40" y="660" width="880" height="108" rx="12" fill="#0f172a" filter="url(#shadow)"/>
  <text x="64" y="688" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="0.06em" style="text-transform:uppercase">background daemons</text>
  <text x="64" y="712" font-size="13" font-weight="600" fill="#ffffff">recall-daemon</text>
  <text x="64" y="728" font-size="11" fill="#94a3b8">warm MLX socket &lt;200 ms</text>
  <text x="250" y="712" font-size="13" font-weight="600" fill="#ffffff">idle-daemon</text>
  <text x="250" y="728" font-size="11" fill="#94a3b8">MCP-only clients (Devin, Codex)</text>
  <text x="490" y="712" font-size="13" font-weight="600" fill="#ffffff">ingest-daemon</text>
  <text x="490" y="728" font-size="11" fill="#94a3b8">bulk vault ingestion</text>
  <text x="660" y="712" font-size="13" font-weight="600" fill="#ffffff">maint-daemon</text>
  <text x="660" y="728" font-size="11" fill="#94a3b8">synthesis + cleanup nightly</text>
  <text x="64" y="754" font-size="11" fill="#94a3b8">No Ollama · No Qdrant · No cloud API · No keys — prompts + memories never leave the Mac</text>
  <text x="850" y="712" font-size="28" font-weight="800" fill="#38bdf8" text-anchor="middle">96.4%</text>
  <text x="850" y="732" font-size="11" fill="#94a3b8" text-anchor="middle">less MCP context</text>
  <text x="850" y="754" font-size="11" fill="#94a3b8" text-anchor="middle">agent vs full profile</text>
</svg>
