  <text x="375" y="487" class="meta">warm socket (recall-daemon)</text>

  <rect x="483" y="424" width="193" height="68" class="box box-mlx" rx="8" filter="url(#shadow)"/>
  <text x="580" y="443" class="label">reranker</text>
  <text x="580" y="459" class="meta">Qwen3-Reranker-0.6B</text>
  <text x="580" y="473" class="meta">P(yes) scoring · α=0.7 fusion</text>

  <rect x="688" y="424" width="222" height="68" class="box box-mlx" rx="8" filter="url(#shadow)"/>
  <text x="799" y="443" class="label">chat / ask / synthesis</text>
  <text x="799" y="459" class="meta">Qwen2.5-7B + 4B helper · lazy</text>
  <text x="799" y="473" class="meta">RAG (cites by id)</text>
  <text x="799" y="487" class="meta">cross-cluster synthesis</text>

