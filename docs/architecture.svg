<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .title    { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .sub      { font-size: 13px; fill: #64748b; }
    .section  { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.06em; text-transform: uppercase; }
    .box-client { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .box-blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
    .box-core { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; }
    .box-mlx  { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
    .box-hook { fill: #fdf4ff; stroke: #d8b4fe; stroke-width: 1.5; }
    .box-store { fill: #fef3c7; stroke: #fcd34d; stroke-width: 1.5; }
    .box-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; }
    .box-red  { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.5; }
    .box-purple { fill: #fdf4ff; stroke: #e9d5ff; stroke-width: 1.5; }
    .box-teal { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 1.5; }
    .box      { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .group-rect { fill: none; stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4 4; }
    .label    { font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .meta     { font-size: 11px; fill: #64748b; text-anchor: middle; }
    .meta-l   { font-size: 11px; fill: #64748b; text-anchor: start; }
    .arrow    { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .arrow-b  { stroke: #2563eb; stroke-width: 1.6; fill: none; marker-end: url(#arrow-blue); stroke-dasharray: 5 3; }
  </style>

  <rect x="0" y="0" width="960" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="40" class="title">memo — how it fits in your stack</text>
  <text x="40" y="60" class="sub">Local MCP memory · MLX on Apple Silicon or CPU on Linux · 108 CLI commands · 124 MCP tools</text>

  <!-- ============== CLIENTS ROW ============== -->
  <text x="40" y="96" class="section">clients</text>
  <rect x="40" y="103" width="880" height="72" class="group-rect" rx="10"/>

  <rect x="55" y="112" width="125" height="48" class="box-client box" rx="8" filter="url(#shadow)"/>
  <text x="118" y="133" class="label">Claude Code</text>
  <text x="118" y="150" class="meta">MCP + hooks + plugin</text>

  <rect x="193" y="112" width="125" height="48" class="box-client box" rx="8" filter="url(#shadow)"/>
  <text x="256" y="133" class="label">Devin / Codex</text>
  <text x="256" y="150" class="meta">MCP stdio · SKILL.md</text>

  <rect x="331" y="112" width="125" height="48" class="box-client box" rx="8" filter="url(#shadow)"/>
  <text x="394" y="133" class="label">OpenCode</text>
  <text x="394" y="150" class="meta">MCP stdio · core profile</text>

  <rect x="469" y="112" width="125" height="48" class="box-client box" rx="8" filter="url(#shadow)"/>
  <text x="532" y="133" class="label">Cursor / Cline</text>
  <text x="532" y="150" class="meta">MCP stdio</text>

  <rect x="607" y="112" width="125" height="48" class="box-client box" rx="8" filter="url(#shadow)"/>
  <text x="670" y="133" class="label">Devin Desktop</text>
  <text x="670" y="150" class="meta">mcp.json</text>

  <rect x="745" y="112" width="165" height="48" class="box-client box" rx="8" filter="url(#shadow)"/>
  <text x="828" y="133" class="label">your shell</text>
  <text x="828" y="150" class="meta">memo CLI · 95 commands</text>

  <!-- arrows down -->
  <line class="arrow" x1="118" y1="160" x2="118" y2="196"/>
  <line class="arrow" x1="256" y1="160" x2="256" y2="196"/>
  <line class="arrow" x1="394" y1="160" x2="394" y2="196"/>
  <line class="arrow" x1="532" y1="160" x2="532" y2="196"/>
  <line class="arrow" x1="670" y1="160" x2="670" y2="196"/>
  <line class="arrow" x1="828" y1="160" x2="828" y2="196"/>

  <!-- ============== ENTRY POINTS ============== -->
  <text x="40" y="193" class="section">entry points</text>
  <rect x="40" y="199" width="880" height="58" class="group-rect" rx="10"/>

  <rect x="55" y="207" width="650" height="42" class="box box-blue" rx="8" filter="url(#shadow)"/>
  <text x="380" y="227" class="label">memo-mcp (FastMCP stdio) — 170 tools in the full profile</text>
  <text x="380" y="243" class="meta">MEMO_MCP_PROFILE:  agent (49 tools ~7k tokens)  ·  core/slim (66 tools ~8.2k)  ·  full/default (170 tools ~21k)</text>

  <rect x="720" y="207" width="190" height="42" class="box" rx="8" filter="url(#shadow)"/>
  <text x="815" y="227" class="label">memo CLI</text>
  <text x="815" y="243" class="meta">95 commands · same API</text>

  <!-- arrows to core -->
  <line class="arrow" x1="380" y1="249" x2="380" y2="285"/>
  <line class="arrow" x1="815" y1="249" x2="815" y2="285"/>

