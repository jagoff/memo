<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #1a202c; }
      .subtitle { font-size: 13px; fill: #4a5568; }
      .phase-num { font-size: 18px; font-weight: bold; fill: #fff; }
      .phase-title { font-size: 14px; font-weight: bold; fill: #1a202c; }
      .phase-desc { font-size: 11px; fill: #2d3748; }
      .arrow-line { stroke: #2d3748; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .box { stroke: #2d3748; stroke-width: 2; }
      .phase-odd { fill: #e6f3ff; }
      .phase-even { fill: #fff5e6; }
      .legend-box { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1; }
      .legend-text { font-size: 10px; fill: #4a5568; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2d3748" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="35" class="title" text-anchor="middle">memo dream — Autonomous Nightly Maintenance (7 phases, ~15–45 min)</text>
  <text x="700" y="53" class="subtitle" text-anchor="middle">Runs at 03:00 AM (launchd) to synthesize, heal, decay, and optimize the corpus</text>

  <!-- Phase 1: Orientation -->
  <g>
    <circle cx="100" cy="150" r="20" class="phase-odd" class="box" fill="#d4e6f7" stroke="#2d3748" stroke-width="2"/>
    <text x="100" y="158" class="phase-num" text-anchor="middle" font-size="16">1</text>

    <rect x="40" y="180" width="120" height="100" class="phase-odd box"/>
    <text x="100" y="205" class="phase-title" text-anchor="middle">📊 Orientation</text>
    <text x="50" y="225" class="phase-desc">Read-only inventory:</text>
    <text x="50" y="240" class="phase-desc">• Total memories</text>
    <text x="50" y="255" class="phase-desc">• Low-ROI count</text>
    <text x="50" y="270" class="phase-desc">• Stale (365d+)</text>
  </g>

  <!-- Arrow 1→2 -->
  <path d="M 160 230 L 220 230" class="arrow-line"/>

  <!-- Phase 2: Signal Gather -->
  <g>
    <circle cx="280" cy="150" r="20" class="phase-even" class="box" fill="#fef3e6" stroke="#2d3748" stroke-width="2"/>
    <text x="280" y="158" class="phase-num" text-anchor="middle">2</text>

    <rect x="220" y="180" width="120" height="100" class="phase-even box"/>
    <text x="280" y="205" class="phase-title" text-anchor="middle">⛏️ Signal Gather</text>
    <text x="230" y="225" class="phase-desc">Mine transcripts:</text>
    <text x="230" y="240" class="phase-desc">• Ground-truth labels</text>
    <text x="230" y="255" class="phase-desc">• Knowledge gaps</text>
    <text x="230" y="270" class="phase-desc">• Usage signals</text>
  </g>

  <!-- Arrow 2→3 -->
  <path d="M 340 230 L 400 230" class="arrow-line"/>

  <!-- Phase 3: Heal -->
  <g>
    <circle cx="460" cy="150" r="20" class="phase-odd" class="box" fill="#d4e6f7" stroke="#2d3748" stroke-width="2"/>
    <text x="460" y="158" class="phase-num" text-anchor="middle">3</text>

    <rect x="400" y="180" width="120" height="100" class="phase-odd box"/>
    <text x="460" y="205" class="phase-title" text-anchor="middle">⚔️ Heal</text>
    <text x="410" y="225" class="phase-desc">Resolve conflicts:</text>
    <text x="410" y="240" class="phase-desc">• Contradictions</text>
    <text x="410" y="255" class="phase-desc">• Duplicate clusters</text>
    <text x="410" y="270" class="phase-desc">  (cosine ≥0.9)</text>
  </g>

  <!-- Arrow 3→4 -->
  <path d="M 520 230 L 580 230" class="arrow-line"/>

  <!-- Phase 4: Prune -->
  <g>
    <circle cx="640" cy="150" r="20" class="phase-even" class="box" fill="#fef3e6" stroke="#2d3748" stroke-width="2"/>
    <text x="640" y="158" class="phase-num" text-anchor="middle">4</text>

    <rect x="580" y="180" width="120" height="100" class="phase-even box"/>
    <text x="640" y="205" class="phase-title" text-anchor="middle">📉 Prune</text>
    <text x="590" y="225" class="phase-desc">Decay old memories:</text>
    <text x="590" y="240" class="phase-desc">• Archive 365d+</text>
    <text x="590" y="255" class="phase-desc">• ROI ×= 0.98 (idle</text>
    <text x="590" y="270" class="phase-desc">  >30d)</text>
  </g>

  <!-- Arrow 4→5 -->
  <path d="M 700 230 L 760 230" class="arrow-line"/>

  <!-- Phase 5: Enrich -->
  <g>
    <circle cx="820" cy="150" r="20" class="phase-odd" class="box" fill="#d4e6f7" stroke="#2d3748" stroke-width="2"/>
    <text x="820" y="158" class="phase-num" text-anchor="middle">5</text>

    <rect x="760" y="180" width="120" height="100" class="phase-odd box"/>
    <text x="820" y="205" class="phase-title" text-anchor="middle">🔮 Enrich</text>
    <text x="770" y="225" class="phase-desc">Synthesize & extract:</text>
    <text x="770" y="240" class="phase-desc">• LLM cross-cluster</text>
    <text x="770" y="255" class="phase-desc">  insights</text>
    <text x="770" y="270" class="phase-desc">• Entity backfill</text>
  </g>

  <!-- Arrow 5→6 -->
  <path d="M 880 230 L 940 230" class="arrow-line"/>

  <!-- Phase 6: Optimize -->
  <g>
    <circle cx="1000" cy="150" r="20" class="phase-even" class="box" fill="#fef3e6" stroke="#2d3748" stroke-width="2"/>
    <text x="1000" y="158" class="phase-num" text-anchor="middle">6</text>

    <rect x="940" y="180" width="120" height="100" class="phase-even box"/>
    <text x="1000" y="205" class="phase-title" text-anchor="middle">📦 Optimize</text>
    <text x="950" y="225" class="phase-desc">Index hygiene:</text>
    <text x="950" y="240" class="phase-desc">• Prune low-quality</text>
    <text x="950" y="255" class="phase-desc">• Evict if full (LFU)</text>
    <text x="950" y="270" class="phase-desc">• Compress context</text>
  </g>

  <!-- Arrow 6→7 -->
  <path d="M 1060 230 L 1120 230" class="arrow-line"/>

  <!-- Phase 7: Prewarm -->
  <g>
    <circle cx="1180" cy="150" r="20" class="phase-odd" class="box" fill="#d4e6f7" stroke="#2d3748" stroke-width="2"/>
    <text x="1180" y="158" class="phase-num" text-anchor="middle">7</text>

    <rect x="1120" y="180" width="120" height="100" class="phase-odd box"/>
    <text x="1180" y="205" class="phase-title" text-anchor="middle">🔥 Prewarm</text>
    <text x="1130" y="225" class="phase-desc">Prepare next session:</text>
    <text x="1130" y="240" class="phase-desc">• Cache top-100</text>
    <text x="1130" y="255" class="phase-desc">  query embeddings</text>
    <text x="1130" y="270" class="phase-desc">→ <200 ms recall</text>
  </g>

  <!-- Bottom row: Optional self-improvement passes -->
  <g>
    <text x="50" y="380" style="font-size: 13px; font-weight: bold; fill: #5a67d8;">Optional Self-Improvement (flag-gated, all default OFF):</text>

    <!-- Tuner -->
    <rect x="50" y="400" width="280" height="120" class="box" style="fill: #edf2f7; stroke-dasharray: 4,4;"/>
    <text x="190" y="425" class="phase-title" text-anchor="middle">🎯 Tuner</text>
    <text x="60" y="445" class="phase-desc">MEMO_DREAM_TUNE_ENABLED=1</text>
    <text x="60" y="460" class="phase-desc">• Mine ground-truth labels from usage</text>
    <text x="60" y="475" class="phase-desc">• Line-search MEMO_RECALL_MIN_SIM</text>
    <text x="60" y="490" class="phase-desc">• Auto-apply winner, auto-revert if regress</text>
    <text x="60" y="505" class="phase-desc" style="font-style: italic;">cmd: memo dream tune</text>
  </g>

  <!-- Consolidate -->
  <g>
    <rect x="350" y="400" width="280" height="120" class="box" style="fill: #edf2f7; stroke-dasharray: 4,4;"/>
    <text x="490" y="425" class="phase-title" text-anchor="middle">📚 Consolidate</text>
    <text x="360" y="445" class="phase-desc">MEMO_DREAM_CONSOLIDATE_EPISODES_ENABLED=1</text>
    <text x="360" y="460" class="phase-desc">• Group episodes by project</text>
    <text x="360" y="475" class="phase-desc">• Abstract recurring work into synthesis</text>
    <text x="360" y="490" class="phase-desc">• Distinct from per-turn signal gather</text>
    <text x="360" y="505" class="phase-desc" style="font-style: italic;">cmd: memo dream consolidate</text>
  </g>

  <!-- Anticipate -->
  <g>
    <rect x="650" y="400" width="280" height="120" class="box" style="fill: #edf2f7; stroke-dasharray: 4,4;"/>
    <text x="790" y="425" class="phase-title" text-anchor="middle">🔭 Anticipate</text>
    <text x="660" y="445" class="phase-desc">MEMO_DREAM_ANTICIPATE_ENABLED=1</text>
    <text x="660" y="460" class="phase-desc">• Surface unmet gaps + hot queries</text>
    <text x="660" y="475" class="phase-desc">• Pre-warm embeddings for next session</text>
    <text x="660" y="490" class="phase-desc">• Never fabricates, data-driven only</text>
    <text x="660" y="505" class="phase-desc" style="font-style: italic;">cmd: memo dream anticipate</text>
  </g>

  <!-- Receipt & Result -->
  <g>
    <rect x="950" y="400" width="400" height="120" class="box" style="fill: #fffaf0;"/>
    <text x="1150" y="425" class="phase-title" text-anchor="middle">📋 Receipt</text>
    <text x="960" y="445" class="phase-desc">Location: ~/.memo-state/dream/last.json</text>
    <text x="960" y="460" class="phase-desc">• timestamp, duration, phases executed</text>
    <text x="960" y="475" class="phase-desc">• counts (resolved, consolidated, archived, etc)</text>
    <text x="960" y="490" class="phase-desc">• errors[] (failures never silent)</text>
    <text x="960" y="505" class="phase-desc" style="font-weight: bold; color: #2d3748;">cmd: memo dream status</text>
  </g>

  <!-- Timeline & Scheduling -->
  <g>
    <rect x="50" y="580" width="1300" height="80" class="legend-box"/>
    <text x="70" y="605" style="font-size: 12px; font-weight: bold; fill: #1a202c;">⏱️ Schedule & Commands</text>
    <text x="70" y="625" class="legend-text">• Automatic: LaunchAgent @ 03:00 AM (macOS)</text>
    <text x="70" y="640" class="legend-text">• Manual: memo dream run (foreground) | memo dream if-due (24h guard, for cron)</text>

    <text x="500" y="625" class="legend-text">• Receipt: shows all phase counts, errors, duration</text>
    <text x="500" y="640" class="legend-text">• Rollback: memo dream tune --rollback (revert auto-tuned params)</text>

    <text x="1000" y="625" class="legend-text">• Failures NEVER silently swallowed; all recorded in receipt</text>
    <text x="1000" y="640" class="legend-text">• No phase stops the pipeline if it fails — next phases run anyway</text>
  </g>

  <!-- Key insight box -->
  <g>
    <rect x="50" y="720" width="1300" height="60" class="box" style="fill: #f0fff4; stroke: #22543d; stroke-width: 2;"/>
    <text x="700" y="745" class="phase-title" text-anchor="middle" style="fill: #22543d;">💡 Key Insight</text>
    <text x="70" y="765" class="phase-desc" style="fill: #22543d; font-weight: 500;">memo dream is the ONLY MCP memory system that auto-optimizes its own retrieval quality (tuner), auto-detects knowledge gaps (anticipate), and consolidates recurring patterns (consolidate) — all without user intervention. Runs nightly, learns from real usage, auto-reverts on regression.</text>
  </g>
</svg>
