<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <marker id="arr"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    .title   { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .sub     { font-size: 12px; fill: #64748b; }
    .ev      { font-size: 12px; font-weight: 700; fill: #6b21a8; text-anchor: middle; }
    .step    { font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .detail  { font-size: 11px; fill: #475569; text-anchor: middle; }
    .mono    { font-size: 11px; fill: #1e40af; text-anchor: middle; font-family: monospace; }
    .note    { font-size: 10px; fill: #64748b; text-anchor: middle; }
    .badge   { font-size: 10px; font-weight: 700; text-anchor: middle; }
    .box-ev  { fill: #fdf4ff; stroke: #a855f7; stroke-width: 1.5; }
    .box-cmd { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .box-mem { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
    .box-ai  { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .box-out { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
    .line-p  { stroke: #a855f7; stroke-width: 1.8; fill: none; marker-end: url(#arr-p); }
    .line-g  { stroke: #22c55e; stroke-width: 1.8; fill: none; marker-end: url(#arr-g); }
    .line-o  { stroke: #f97316; stroke-width: 1.8; fill: none; marker-end: url(#arr-o); }
    .line    { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .async-badge { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1; rx: 4; ry: 4; }
    .sync-badge  { fill: #fef9c3; stroke: #facc15; stroke-width: 1; rx: 4; ry: 4; }
  </style>

  <text x="40" y="38" class="title">memo ambient memory loop</text>
  <text x="40" y="56" class="sub">Four Claude Code hooks · zero manual /memo invocations · 100% local</text>

  <!-- ── SESSION START ───────────────────────────────── -->
  <!-- Event badge -->
  <rect x="40" y="80" width="160" height="30" rx="6" class="box-ev" filter="url(#sh)"/>
  <text x="120" y="100" class="ev">SessionStart</text>

  <!-- prewarm (async) -->
  <rect x="220" y="73" width="230" height="44" rx="8" class="box-cmd" filter="url(#sh)"/>
  <text x="335" y="93" class="step">memo prewarm</text>
  <text x="335" y="109" class="detail">load embedder + reranker · write warm signal</text>
  <rect x="457" y="78" width="42" height="14" rx="3" class="async-badge"/>
  <text x="478" y="89" class="badge" fill="#0369a1">async</text>

  <!-- briefing (sync) -->
  <rect x="220" y="127" width="230" height="44" rx="8" class="box-out" filter="url(#sh)"/>
  <text x="335" y="147" class="step">memo briefing</text>
  <text x="335" y="163" class="detail">El Briefing → additionalContext</text>
  <rect x="457" y="132" width="34" height="14" rx="3" class="sync-badge"/>
  <text x="474" y="143" class="badge" fill="#92400e">sync</text>

  <!-- lines from event to commands -->
  <line class="line-p" x1="200" y1="90"  x2="218" y2="92"/>
  <line class="line-p" x1="200" y1="96"  x2="218" y2="142"/>

  <!-- El Briefing output box -->
  <rect x="500" y="120" width="340" height="68" rx="8" class="box-out" filter="url(#sh)"/>
  <text x="670" y="141" class="step">El Briefing panel (additionalContext)</text>
  <text x="670" y="157" class="detail">last session in this project  ·  open loops (7-day window)</text>
  <text x="670" y="172" class="detail">memory of the day  ·  crash recovery command</text>
  <line class="line-g" x1="450" y1="149" x2="498" y2="155"/>

  <!-- warm signal annotation -->
  <rect x="500" y="73" width="185" height="40" rx="8" class="box-cmd" filter="url(#sh)"/>
  <text x="593" y="91" class="mono">~/.local/share/memo/.prewarm_ts</text>
  <text x="593" y="106" class="note">mtime read by recall-hook to detect cold start</text>
  <line class="line" x1="450" y1="88" x2="498" y2="88"/>

  <!-- ── USER PROMPT SUBMIT ───────────────────────────── -->
  <rect x="40" y="230" width="160" height="30" rx="6" class="box-ev" filter="url(#sh)"/>
  <text x="120" y="250" class="ev">UserPromptSubmit</text>

  <!-- recall-hook flow -->
  <rect x="220" y="220" width="220" height="52" rx="8" class="box-cmd" filter="url(#sh)"/>
  <text x="330" y="242" class="step">memo recall-hook</text>
  <text x="330" y="258" class="detail">embed prompt  ·  check warm signal</text>
  <text x="330" y="272" class="note">warm → vec · cold → bm25 fallback  ·  5 s budget</text>
  <line class="line-p" x1="200" y1="245" x2="218" y2="245"/>

  <!-- search arrow -->
  <line class="line" x1="440" y1="246" x2="480" y2="246"/>

  <!-- Memory store box -->
  <rect x="480" y="220" width="200" height="52" rx="8" class="box-mem" filter="url(#sh)"/>
  <text x="580" y="242" class="step">Memory store</text>
  <text x="580" y="258" class="detail">hybrid search (vec + BM25 + RRF)</text>
  <text x="580" y="272" class="detail">cross-encoder rerank  ·  project boost</text>

  <!-- top-3 output -->
  <line class="line-g" x1="680" y1="246" x2="720" y2="246"/>
  <rect x="720" y="220" width="160" height="52" rx="8" class="box-out" filter="url(#sh)"/>
  <text x="800" y="242" class="step">top-3 memorias</text>
  <text x="800" y="258" class="detail">↑ additionalContext</text>
  <text x="800" y="272" class="detail">agent sees before answering</text>

  <!-- ── AGENT RESPONSE ───────────────────────────────── -->
  <rect x="40" y="330" width="160" height="30" rx="6" class="box-ai" filter="url(#sh)"/>
  <text x="120" y="350" class="ev" style="fill:#1d4ed8">Agent answers</text>

  <text x="240" y="352" class="detail" style="text-anchor:start">context-aware response — memorias were already injected above the prompt</text>

  <!-- ── STOP ───────────────────────────────────────────── -->
  <rect x="40" y="400" width="160" height="30" rx="6" class="box-ev" filter="url(#sh)"/>
  <text x="120" y="420" class="ev">Stop</text>

  <!-- capture-stop (async) -->
  <rect x="220" y="390" width="240" height="54" rx="8" class="box-cmd" filter="url(#sh)"/>
  <text x="340" y="412" class="step">memo capture-stop</text>
  <text x="340" y="428" class="detail">helper LLM reads last N exchanges</text>
  <text x="340" y="443" class="detail">extracts insights · deduplicates · saves</text>
  <rect x="468" y="396" width="42" height="14" rx="3" class="async-badge"/>
  <text x="489" y="407" class="badge" fill="#0369a1">async</text>

  <!-- session checkpoint (async) -->
  <rect x="220" y="454" width="240" height="44" rx="8" class="box-cmd" filter="url(#sh)"/>
  <text x="340" y="474" class="step">memo session checkpoint</text>
  <text x="340" y="490" class="detail">snapshot cwd · branch · summary · last msg</text>
  <rect x="468" y="459" width="42" height="14" rx="3" class="async-badge"/>
  <text x="489" y="470" class="badge" fill="#0369a1">async</text>

  <line class="line-p" x1="200" y1="415" x2="218" y2="415"/>
  <line class="line-p" x1="200" y1="422" x2="218" y2="472"/>

  <!-- save arrow from capture -->
  <line class="line-o" x1="460" y1="418" x2="498" y2="418"/>
  <rect x="498" y="394" width="200" height="50" rx="8" class="box-mem" filter="url(#sh)"/>
  <text x="598" y="416" class="step">auto-saved to vault</text>
  <text x="598" y="432" class="detail">new .md  ·  re-embedded  ·  indexed</text>
  <text x="598" y="447" class="detail">available on next recall-hook</text>

  <!-- session file -->
  <line class="line" x1="460" y1="472" x2="498" y2="510"/>
  <rect x="498" y="494" width="200" height="36" rx="8" class="box-cmd"/>
  <text x="598" y="512" class="step">sessions/</text>
  <text x="598" y="527" class="detail">next SessionStart → El Briefing "last session"</text>

  <!-- ── LOOP BACK ───────────────────────────────────────── -->
  <!-- vertical loop back line on the right side -->
  <path d="M 840 272 Q 870 272 870 420 Q 870 560 720 560 Q 120 560 120 445"
        stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 3" fill="none" marker-end="url(#arr-p)"/>
  <text x="860" y="400" class="note" style="text-anchor:end;fill:#a855f7">next session</text>

  <!-- ── LEGEND ─────────────────────────────────────────── -->
  <rect x="40" y="560" width="820" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="578" class="note" style="text-anchor:start">hooks.json wiring →</text>
  <rect x="160" y="567" width="42" height="14" rx="3" class="async-badge"/>
  <text x="181" y="578" class="badge" fill="#0369a1">async</text>
  <text x="210" y="578" class="note" style="text-anchor:start">non-blocking (30 s budget)</text>
  <rect x="370" y="567" width="34" height="14" rx="3" class="sync-badge"/>
  <text x="387" y="578" class="badge" fill="#92400e">sync</text>
  <text x="412" y="578" class="note" style="text-anchor:start">blocks until done (5 s budget)</text>
  <text x="60" y="597" class="note" style="text-anchor:start">recall-hook: warm → vec search  ·  cold (no .prewarm_ts in last 60 min) → bm25 fallback — never blocks prompt submission</text>
</svg>
