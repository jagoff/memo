name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    name: MCP Registry
    runs-on: ubuntu-latest
    needs: pypi
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher
      - name: Wait for PyPI propagation
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          for i in $(seq 1 12); do
            if curl -sf "https://pypi.org/pypi/mlx-memo/${version}/json" > /dev/null 2>&1; then
              echo "PyPI version ${version} is available"
              break
            fi
            echo "Waiting for PyPI propagation (attempt ${i}/12)..."
            sleep 10
          done
      - name: Publish server.json
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
