name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - name: Build distribution
        run: |
          python -m pip install uv==0.11.21
          uv sync --frozen --extra dev --python 3.13
          .venv/bin/python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          skip-existing: true

  mcp-registry:
    name: MCP Registry
    runs-on: ubuntu-latest
    needs: pypi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install mcp-publisher
        run: |
          curl --fail --location --output /tmp/mcp-publisher_linux_amd64.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz"
          cd /tmp
          sha256sum --check "$GITHUB_WORKSPACE/.github/mcp-publisher.sha256"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/mcp-publisher
      - name: Wait for PyPI propagation
        id: propagation
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          available=0
          for i in $(seq 1 12); do
            if curl -sf "https://pypi.org/pypi/mlx-memo/${version}/json" > /dev/null 2>&1; then
              echo "PyPI version ${version} is available"
              available=1
              echo "available=1" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Waiting for PyPI propagation (attempt ${i}/12)..."
            sleep 10
          done
          if [[ "$available" != "1" ]]; then
            echo "PyPI version ${version} did not propagate after 12 attempts" >&2
            exit 1
          fi
      - name: Publish server.json
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
