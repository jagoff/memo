name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/release-quality.yml

  verify-release:
    name: Verify release provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Require a version-matched tag from master
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "publish requires a tag ref, got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "release commit ${GITHUB_SHA} is not part of origin/master" >&2
            exit 1
          fi
      - name: Validate committed release metadata
        run: |
          python -m pip install uv==0.11.21
          uv sync --frozen --no-dev
          uv run --no-sync memo release check

  github-release:
    # Pushing a release tag is the only manual step: this job creates the
    # GitHub Release from the tag's CHANGELOG section, so the publish chain
    # (Release -> PyPI -> MCP registry) can never silently freeze again.
    # No-op when the release already exists (release-event and re-run paths).
    name: GitHub Release
    needs: [verify-release, quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then
            echo "See CHANGELOG.md for details." > /tmp/notes.md
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md --verify-tag

  build:
    name: Build distributions
    needs: [verify-release, quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Build distribution
        run: |
          python -m pip install uv==0.11.21
          uv lock --check
          uv build --out-dir dist
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
      - name: Upload immutable distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  pypi:
    name: PyPI
    needs: [build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1

  mcp-registry:
    name: MCP Registry
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl --fail --location --output /tmp/mcp-publisher_linux_amd64.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz"
          cd /tmp
          sha256sum --check "$GITHUB_WORKSPACE/.github/mcp-publisher.sha256"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/mcp-publisher
      - name: Wait for PyPI propagation
        id: propagation
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          available=0
          for i in $(seq 1 12); do
            if curl -sf "https://pypi.org/pypi/mlx-memo/${version}/json" > /dev/null 2>&1; then
              echo "PyPI version ${version} is available"
              available=1
              echo "available=1" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Waiting for PyPI propagation (attempt ${i}/12)..."
            sleep 10
          done
          if [[ "$available" != "1" ]]; then
            echo "PyPI version ${version} did not propagate after 12 attempts" >&2
            exit 1
          fi
      - name: Publish server.json
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
