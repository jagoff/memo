name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    # Linux runner is enough — `mlx`/`mlx-lm` deps are gated to
    # `darwin/arm64` in pyproject.toml and the real-MLX smoke tests
    # auto-skip via the `requires_mlx` marker (see conftest.py) when
    # `mlx_lm` isn't importable.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install uv
        run: pip install uv==0.11.21
      - name: Install package + dev deps
        run: |
          uv sync --frozen --extra dev --extra cpu --extra http --python ${{ matrix.python-version }}
      - name: Format check (ruff)
        run: .venv/bin/ruff format --check .
      - name: Lint (ruff)
        run: .venv/bin/ruff check src/ tests/ scripts/
      - name: Type check (mypy)
        run: .venv/bin/mypy src/memo
      - name: Progressive quality budget
        run: .venv/bin/python scripts/quality_gate.py
      - name: Resource hygiene (serial ownership gate)
        run: >-
          .venv/bin/python -m pytest -m "resource_hygiene" -n 0
          --timeout=120 --resource-hygiene
      - name: Tests (excluding slow real-MLX smoke)
        # -n auto: parallelize across cores. --timeout: kill hung MLX/socket
        # tests. --cov + fail_under (pyproject) gates coverage regressions.
        run: >-
          .venv/bin/python -m pytest -m "not slow" -n auto --timeout=120
          --cov=memo --cov-report=term-missing --cov-report=xml
      - name: Changed-lines coverage
        if: github.event_name == 'pull_request'
        run: >-
          .venv/bin/diff-cover coverage.xml
          --compare-branch=origin/master --fail-under=90 --show-uncovered

  test-int8:
    # MEMO_VEC_QUANTIZE now defaults to int8 for fresh installs (v3.10.0), but
    # the `test` job above forces it `off` (tests/conftest.py) because many
    # pre-quantization asserts pin exact float32 cosine values
    # (`pytest.approx(..., abs=1e-6)`) that int8's ~1/127 precision breaks —
    # so the shipped default was otherwise only exercised by
    # tests/test_vec_quantize.py. This lane re-runs the same non-slow suite
    # with int8 forced on, deselecting only the tests marked
    # `float32_precision` (legitimately float32-only asserts) — everything
    # else must behave identically under quantization.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.21
      - name: Install package + dev deps
        run: uv sync --frozen --extra dev --extra cpu --extra http --python 3.13
      - name: Tests under MEMO_VEC_QUANTIZE=int8 (excluding slow + float32-only precision asserts)
        env:
          MEMO_VEC_QUANTIZE: int8
        run: .venv/bin/python -m pytest -m "not slow and not float32_precision" -n auto --timeout=120

  contract-stub-compatibility:
    # Public, always-on interface gate. The stub only models the contract API
    # memo consumes and forces every optional integration import down its live
    # branch without exposing the private implementation repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.21
      - name: Install package + dev dependencies
        run: uv sync --frozen --extra dev --python 3.13
      - name: Exercise public contract interface
        run: .venv/bin/python -m pytest tests/test_contract_stub_compatibility.py

  private-contract-integration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # The default `test` job mirrors a CLEAN install: consciousness_contracts is
    # absent, so every contract import takes its fallback branch and the
    # INTEGRATION path (cache / uri / ledger / run_json / EmbedderProfile) is
    # never exercised. That blind spot is the launchd-fleet crash class — a
    # runtime that *does* have the contract but wires it wrong.
    #
    # consciousness-contracts is a PRIVATE sibling repo, so a public-repo CI
    # can't read it with the default GITHUB_TOKEN. This job is therefore an
    # optional private integration until a `CONTRACTS_TOKEN` secret (a
    # fine-grained PAT with read access to jagoff/consciousness-contracts) is
    # set; the public contract-stub-compatibility gate above always runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.21
      - name: Install package + dev deps + consciousness_contracts
        id: install
        env:
          CONTRACTS_TOKEN: ${{ secrets.CONTRACTS_TOKEN }}
        run: |
          if [ -z "$CONTRACTS_TOKEN" ]; then
            echo "::notice::CONTRACTS_TOKEN not set — skipping optional private integration."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          uv sync --frozen --extra dev --extra cpu --python 3.13
          uv pip install "consciousness-contracts @ git+https://x-access-token:${CONTRACTS_TOKEN}@github.com/jagoff/consciousness-contracts.git"
      - name: Verify contract API + run suite with integration path live
        if: steps.install.outputs.enabled == 'true'
        run: |
          # The contract API surface memo depends on must import cleanly.
          .venv/bin/python -c "from consciousness_contracts import EmbedderProfile, run_json, ConsciousnessEvent, LedgerWriter, BackendError; print('consciousness_contracts API ok')"
          .venv/bin/python -m pytest -m "not slow" -n auto --timeout=120
