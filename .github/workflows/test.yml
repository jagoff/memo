name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    # Linux runner is enough — `mlx`/`mlx-lm` deps are gated to
    # `darwin/arm64` in pyproject.toml and the real-MLX smoke tests
    # auto-skip via the `requires_mlx` marker (see conftest.py) when
    # `mlx_lm` isn't importable.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install uv
        run: pip install uv==0.11.21
      - name: Install package + dev deps
        run: |
          uv sync --frozen --extra dev --extra cpu --extra http --python ${{ matrix.python-version }}
      - name: Format check (ruff)
        run: .venv/bin/ruff format --check .
      - name: Lint (ruff)
        run: .venv/bin/ruff check src/ tests/ scripts/
      - name: Type check (mypy)
        run: .venv/bin/mypy src/memo
      - name: Progressive quality budget
        run: .venv/bin/python scripts/quality_gate.py
      - name: Resource hygiene (serial ownership gate)
        run: >-
          .venv/bin/python -m pytest -m "resource_hygiene" -n 0
          --timeout=120 --resource-hygiene
      - name: Conformance (corpus-scale surfaces)
        env:
          MEMO_CONFORMANCE_CORPUS_N: "10000"
        run: .venv/bin/python -m pytest -m "conformance" -n 0 --timeout=600
      - name: Tests (excluding slow real-MLX smoke)
        # -n auto: parallelize across cores. --timeout: kill hung MLX/socket
        # tests. --cov + fail_under (pyproject) gates coverage regressions.
        run: >-
          .venv/bin/python -m pytest -m "not slow and not conformance" -n auto --timeout=120
          --cov=memo --cov-report=term-missing --cov-report=xml
      - name: Changed-lines coverage
        if: github.event_name == 'pull_request'
        # Memo 4 is a deliberately broad runtime migration (retiring the
        # Synapse/Memflow integration). Keep the changed-lines gate strict
        # enough to catch untested regressions while allowing the migration's
        # cross-cutting adapter rewrites to land incrementally.
        run: >-
          .venv/bin/diff-cover coverage.xml
          --compare-branch=origin/master --fail-under=80 --show-uncovered

  web-chat:
    name: Web chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-chat/package-lock.json
      - name: Install web chat dependencies
        working-directory: web-chat
        run: npm ci
      - name: Type-check web chat
        working-directory: web-chat
        run: npm run typecheck
      - name: Build web chat
        working-directory: web-chat
        run: npm run build

  test-int8:
    # MEMO_VEC_QUANTIZE now defaults to int8 for fresh installs (v3.10.0), but
    # the `test` job above forces it `off` (tests/conftest.py) because many
    # pre-quantization asserts pin exact float32 cosine values
    # (`pytest.approx(..., abs=1e-6)`) that int8's ~1/127 precision breaks —
    # so the shipped default was otherwise only exercised by
    # tests/test_vec_quantize.py. This lane re-runs the same non-slow suite
    # with int8 forced on, deselecting only the tests marked
    # `float32_precision` (legitimately float32-only asserts) — everything
    # else must behave identically under quantization.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.21
      - name: Install package + dev deps
        run: uv sync --frozen --extra dev --extra cpu --extra http --python 3.13
      - name: Tests under MEMO_VEC_QUANTIZE=int8 (excluding slow + float32-only precision asserts)
        env:
          MEMO_VEC_QUANTIZE: int8
        run: .venv/bin/python -m pytest -m "not slow and not float32_precision and not conformance" -n auto --timeout=120

  runtime-independence:
    # Memo's core must stay installable and executable without sibling repos,
    # private packages, or external memory daemons.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.21
      - name: Install package + dev dependencies
        run: uv sync --frozen --extra dev --extra cpu --python 3.13
      - name: Prove runtime independence
        run: >-
          .venv/bin/python -m pytest
          tests/test_independence.py
          tests/test_operational_memory.py
          tests/test_definitive_memory.py
          tests/test_definitive_gate.py
      # The floor catches a REGRESSION in journal append cost (an fsync per
      # event, an O(n) re-verify), not the speed of the runner we happened to
      # get. At 250 it measured the latter: two unrelated PRs failed here in
      # one evening at 93.6 and 108 eps on contended shared runners, and both
      # passed on re-run with no code change. A healthy runner clears 250+;
      # the regressions worth catching are order-of-magnitude, so 60 keeps the
      # signal (2.4x the library's own 25 eps default) without the false reds.
      - name: Gate causal-journal throughput
        run: .venv/bin/memo definitive benchmark --events 1000 --minimum-eps 60
