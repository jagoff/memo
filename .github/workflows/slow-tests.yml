name: slow-tests

on:
  schedule:
    # Nightly at 03:00 UTC — runs the slow marker suite skipped in PR CI
    - cron: "0 3 * * *"
  workflow_dispatch:  # manual trigger

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Install package + dev deps
        run: |
          uv venv .venv
          uv pip install -e '.[dev]'
      - name: Run slow tests
        # Full suite including the slow-marked tests skipped in PR CI.
        # No -n auto: some slow tests (socket servers, daemon lifecycle)
        # are sensitive to parallel teardown races.
        run: .venv/bin/python -m pytest -m "slow" --timeout=300 -v

      # ---------------------------------------------------------------------------
      # Retrieval regression eval — MANUAL GATE (cannot run in CI)
      # ---------------------------------------------------------------------------
      # The live-index eval in eval/regression_labels.json requires the developer's
      # memo vault (MLX embeddings + sqlite-vec index). It CANNOT run in GitHub
      # Actions because no vault is present and MLX needs Apple Silicon.
      #
      # What CI DOES run (test.yml + slow-tests.yml):
      #   tests/test_eval_regression_labels.py — schema/format validation only,
      #   no MLX, no vault access. Verifies 25+ prompts, correct field types,
      #   Spanish coverage, noise probes, etc.
      #
      # To run the LIVE retrieval eval locally (after a retrieval/ingest change):
      #   memo eval recall --labels eval/regression_labels.json --k 5 --force
      #
      # A retrieval change MUST keep precision@K high and noise@K low across ALL
      # prompts before merging. Baseline: prec@5=0.2, noise@5=0.0.
      # See CLAUDE.md §Retrieval-regression discipline for the full protocol.
