name: macos-smoke

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  smoke:
    # memo is an Apple-Silicon-first product; this workflow covers the real
    # MLX/runtime path that Linux CI cannot exercise.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.13 + uv via Homebrew
        # actions/setup-python ships a CPython whose sqlite3 lacks
        # enable_load_extension, so sqlite-vec (core to memo) cannot load.
        # Homebrew's python@3.13 has extension loading enabled.
        run: brew install python@3.13 uv
      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/huggingface
          key: macos-hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          # A tooling-only pyproject change must not force a multi-GB model
          # download. Hugging Face snapshots are content-addressed, so an
          # older project cache is a safe seed when the exact key changes.
          restore-keys: |
            macos-hf-${{ runner.os }}-
      - name: Install package + dev deps
        # --extra tantivy/ocr pull the darwin/arm64-only optional backends
        # (tantivy verbatim-FTS + Apple Vision OCR). No other CI job installs
        # them, so their test files run only on this Apple Silicon runner.
        run: uv sync --frozen --extra dev --extra tantivy --extra ocr --python "$(brew --prefix python@3.13)/bin/python3.13"
      - name: Confirm Apple Silicon runner
        run: .venv/bin/python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
      - name: Lint (ruff)
        run: .venv/bin/ruff check src/ tests/
      - name: Type check (mypy)
        run: .venv/bin/mypy src/memo
      - name: Runtime smoke
        # CI legitimately runs from the project .venv, so `--strict-runtime`
        # (which flags any project-venv install) is unsatisfiable here. Drop it
        # and point at a throwaway data_dir the runner can create.
        env:
          MEMO_DATA_DIR: ${{ runner.temp }}/memo-data
          MEMO_STATE_DIR: ${{ runner.temp }}/memo-state
        run: |
          mkdir -p "$MEMO_DATA_DIR"
          test -z "${MEMO_OPERATIONAL_V2_AUTO_ACTIVATE:-}"
          .venv/bin/memo doctor
          .venv/bin/memo operational signal remember \
            --marker macos-fresh-install --epoch 1 --fence ci-smoke
      - name: Tantivy FTS + OCR backend tests
        # The tantivy verbatim-FTS backend and Apple Vision OCR path live behind
        # darwin/arm64-only optional extras that no other CI job installs — so
        # these two files execute in zero environments without this macOS step.
        # No MLX here (pure backend/unit), so it fails fast before the slow
        # real-model step below.
        run: >-
          .venv/bin/python -m pytest
          tests/test_tantivy_index.py tests/test_ocr_obsidian.py
          --timeout=120 -v
      - name: Real-MLX smoke tests
        # test_reranker's two real-model tests are pinned alongside the embedder
        # smoke tests: they load the 4B Qwen3-Reranker MLX model and guard the
        # head-slice-vs-full-forward ranking parity the repo history flags as
        # regression-prone ("reranker batching regresses 4B"). The 4B model is
        # heavier than the 0.6B embedder, so the per-test timeout is 600s to
        # absorb a cold Hugging Face download without a flaky timeout.
        run: >-
          .venv/bin/python -m pytest
          tests/test_smoke_mlx.py::test_embedder_produces_unit_vectors
          tests/test_smoke_mlx.py::test_save_and_search_roundtrip
          tests/test_reranker.py::test_score_real_model_separates_relevant_from_irrelevant
          tests/test_reranker.py::test_head_slice_matches_full_forward_ranking
          -m requires_mlx --timeout=600 -v
      - name: Installer smoke
        env:
          MEMO_INSTALL_SPEC: ${{ github.workspace }}
          MEMO_INSTALL_DOWNLOAD_MODELS: "no"
          MEMO_INSTALL_SKIP_AGENT_CONFIG: "1"
        run: bash ./install.sh
