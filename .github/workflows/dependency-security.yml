name: dependency security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned uv
        run: pip install uv==0.11.21
      - name: Export the committed runtime lock
        run: |
          uv export --frozen --no-dev --all-extras --no-extra dev \
            --no-emit-project --output-file /tmp/memo-requirements.txt
      - name: Audit known Python vulnerabilities
        run: |
          uv tool run --from pip-audit==2.10.1 \
            pip-audit --strict --disable-pip --require-hashes \
              --requirement /tmp/memo-requirements.txt

  web-chat-audit:
    name: Audit web chat dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-chat/package-lock.json
      - name: Install web chat dependencies
        working-directory: web-chat
        run: npm ci
      - name: Audit web chat dependencies
        working-directory: web-chat
        run: npm audit --audit-level=low

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
