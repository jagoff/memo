name: linux-cpu-smoke

# Real end-to-end validation of the CPU (sentence-transformers) backend on
# Ubuntu — the path the unit suite only exercises with a stub. Proves:
#   1. `pip install ".[cpu]"` resolves (torch + sentence-transformers, no MLX)
#   2. sqlite-vec + FTS5 load on the distro Python (the loadable-extensions gotcha)
#   3. the real Qwen3-Embedding-0.6B model loads at 1024-dim
#   4. `memo doctor` is green (exit 0) on a healthy [cpu] install
#   5. the save -> search roundtrip works with real CPU embeddings
#   6. `memo-mcp` builds + registers every tool without MLX
#
# Heavy (downloads torch + a ~1.2 GB model); runs on release tags + on demand,
# and on PRs that touch the backend, not on every commit.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/memo/embedder_st.py"
      - "src/memo/embedder_select.py"
      - "src/memo/platform_detect.py"
      - "src/memo/runtime/**"
      - "pyproject.toml"
      - ".github/workflows/linux-cpu-smoke.yml"

concurrency:
  group: linux-cpu-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Ubuntu CPU backend (real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEMO_NONINTERACTIVE: "1"
      MEMO_EMBEDDER_BACKEND: "st"
      MEMO_DATA_DIR: /tmp/memo-data
      MEMO_STATE_DIR: /tmp/memo-state
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Cache HF model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-embedding-0.6b-v1
      - name: Install (CPU backend)
        run: |
          python -m pip install --upgrade pip
          pip install ".[cpu]"
      - name: Prepare data + state dirs
        # A real install creates these via `memo init` / first save; `memo doctor`
        # flags a missing data_dir on any OS, so set them up for the smoke.
        run: mkdir -p "$MEMO_DATA_DIR" "$MEMO_STATE_DIR"
      - name: import + backend resolves to ST (no MLX on Linux)
        run: |
          python - <<'PY'
          import memo  # must import with no MLX present
          from memo.config import Config
          from memo.embedder_select import resolve_backend
          from memo.platform_detect import mlx_available

          assert mlx_available() is False, "mlx must be unavailable on Linux"
          assert resolve_backend(Config.from_env()) == "st", "backend must be st"
          print("OK: import + st backend")
          PY
      - name: sqlite-vec + FTS5 loadable on this Python (the Linux gotcha)
        run: |
          python - <<'PY'
          import sqlite3
          import sqlite_vec

          c = sqlite3.connect(":memory:")
          c.enable_load_extension(True)
          sqlite_vec.load(c)
          c.execute("CREATE VIRTUAL TABLE v USING vec0(e float[4])")
          c.execute("CREATE VIRTUAL TABLE f USING fts5(x)")
          print("OK: sqlite-vec + fts5 load")
          PY
      - name: memo config validate
        run: memo config validate
      - name: memo doctor must be green (exit 0)
        run: memo doctor
      - name: end-to-end save -> search (real CPU embeddings, real model)
        run: |
          memo save "ubuntu ci smoke: the prod deploy key lives in the ops vault" --type note
          memo search "deploy key" --json > out.json 2> search.err
          cat search.err >&2
          # The MLX cross-encoder reranker must NOT be attempted on Linux (it is
          # forced off in Config.from_env); a "reranker failed" line means the gate
          # regressed.
          if grep -qi "reranker failed" search.err; then
            echo "REGRESSION: reranker attempted on Linux" >&2
            exit 1
          fi
          python - <<'PY'
          import json

          hits = json.load(open("out.json"))
          assert isinstance(hits, list) and len(hits) >= 1, f"no hits: {hits!r}"
          print("OK: save+search roundtrip, hits:", len(hits))
          PY
      - name: memo-mcp real stdio MCP handshake (initialize -> tools/list -> tools/call)
        run: |
          python - <<'PY'
          import json
          import select
          import subprocess

          proc = subprocess.Popen(
              ["memo-mcp"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          def send(obj):
              proc.stdin.write(json.dumps(obj) + "\n")
              proc.stdin.flush()

          def read_msg(timeout=90):
              # MCP stdio is newline-delimited JSON-RPC on stdout; skip any noise.
              while True:
                  r, _, _ = select.select([proc.stdout], [], [], timeout)
                  if not r:
                      raise SystemExit(
                          f"timeout; mcp exited={proc.poll()}; stderr=\n{proc.stderr.read()}"
                      )
                  line = proc.stdout.readline()
                  if not line:
                      raise SystemExit("mcp closed stdout; stderr=\n" + proc.stderr.read())
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      return json.loads(line)
                  except json.JSONDecodeError:
                      continue

          # 1. initialize — the real MCP handshake over stdio
          send({
              "jsonrpc": "2.0", "id": 1, "method": "initialize",
              "params": {
                  "protocolVersion": "2024-11-05", "capabilities": {},
                  "clientInfo": {"name": "smoke", "version": "0"},
              },
          })
          init = read_msg()
          assert init.get("id") == 1 and "result" in init, init
          print("initialize OK:", init["result"].get("serverInfo"))

          # 2. initialized notification
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})

          # 3. tools/list — every memo tool must register over the wire
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
          tl = read_msg()
          tools = [t["name"] for t in tl["result"]["tools"]]
          assert "memo_search" in tools, tools
          print("tools/list OK:", len(tools), "tools, incl.", sorted(tools)[:5])

          # 4. tools/call — dispatch a real tool round-trip over stdio
          send({
              "jsonrpc": "2.0", "id": 3, "method": "tools/call",
              "params": {"name": "memo_version", "arguments": {}},
          })
          cr = read_msg()
          assert cr.get("id") == 3 and ("result" in cr or "error" in cr), cr
          print("tools/call dispatched:", "result" if "result" in cr else "error")

          try:
              proc.stdin.close()
              proc.terminate()
              proc.wait(timeout=10)
          except Exception:
              proc.kill()
          print("OK: memo-mcp stdio MCP handshake")
          PY
