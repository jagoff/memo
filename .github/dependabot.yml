version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-runtime:
        dependency-type: "production"
      python-development:
        dependency-type: "development"
    # Keep Dependabot from widening ML compatibility caps and manufacturing an
    # invalid resolution. transformers 5.13 breaks the current mlx-lm tokenizer
    # path; mlx-vlm 0.6.5+ requires transformers 5.14+.
    ignore:
      - dependency-name: "transformers"
        versions: [">=5.13"]
      - dependency-name: "mlx-vlm"
        versions: [">=0.6.5"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/editors/vscode"
    schedule:
      interval: "weekly"
    groups:
      vscode-extension:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web-chat"
    schedule:
      interval: "weekly"
    groups:
      web-chat:
        patterns: ["*"]
